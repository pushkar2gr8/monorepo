name: Build Financial Apps

on:
  push:
    branches:
      - main
    tags:
      - 'personal-loans@*'
      - 'home-loans@*'

jobs:
  detect-changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.projects.outputs.affected }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Derive SHAs for Nx Affected
        uses: nrwl/nx-set-shas@v4
      - name: List affected projects
        id: projects
        run: echo "affected=$(npx nx show projects --affected --json | jq -c .)" >> "$GITHUB_OUTPUT"

  personal-loans:
    needs: detect-changes
    if: always() && (startsWith(github.ref, 'refs/tags/personal-loans@') || (needs.detect-changes.result == 'success' && contains(needs.detect-changes.outputs.affected, 'personal-loans')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
      - run: npx nx build personal-loans
      - uses: actions/upload-artifact@v4
        with:
          name: personal-loans-${{ github.sha }}
          path: apps/personal-loans/.next
          if-no-files-found: error

  home-loans:
    needs: detect-changes
    if: always() && (startsWith(github.ref, 'refs/tags/home-loans@') || (needs.detect-changes.result == 'success' && contains(needs.detect-changes.outputs.affected, 'home-loans')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
      - run: npx nx build home-loans
      - uses: actions/upload-artifact@v4
        with:
          name: home-loans-${{ github.sha }}
          path: apps/home-loans/.next
          if-no-files-found: error
